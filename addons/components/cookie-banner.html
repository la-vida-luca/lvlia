<div class="cookie-banner" id="cookie-banner" role="dialog" aria-live="polite" aria-labelledby="cookie-title" hidden data-domain="fermesurbaines.com" data-plausible-src="https://plausible.io/js/script.outbound-links.js" data-sri="">
  <div class="cookie-banner__content">
    <h2 id="cookie-title">Cookies & statistiques</h2>
    <p>Nous utilisons des cookies strictement nécessaires et, avec votre accord, des statistiques anonymisées via Plausible.</p>
    <div class="cookie-banner__actions">
      <button type="button" data-cookie-action="accept">Tout accepter</button>
      <button type="button" data-cookie-action="deny">Refuser</button>
      <button type="button" data-cookie-action="customize">Personnaliser</button>
    </div>
  </div>
  <form class="cookie-banner__form" id="cookie-preferences" hidden>
    <fieldset>
      <legend>Préférences</legend>
      <label>
        <input type="checkbox" name="analytics" value="plausible"> Plausible (statistiques anonymisées)
      </label>
    </fieldset>
    <button type="submit">Enregistrer</button>
  </form>
</div>
