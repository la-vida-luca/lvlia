<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard Fermes Urbaines</title>
  <link rel="stylesheet" href="../css/cro-modules.css">
  <link rel="stylesheet" href="dashboard.css">
  <script type="module" src="dashboard.js" defer></script>
</head>
<body class="dashboard" data-analytics-endpoint="/api/events">
  <header>
    <h1>Suivi commercial & analytics</h1>
  </header>
  <main id="main-content">
    <section>
      <h2>KPIs principaux</h2>
      <div class="kpis" id="kpis">
        <article>
          <h3>Sessions 7 jours</h3>
          <p id="kpi-sessions">-</p>
        </article>
        <article>
          <h3>Leads 7 jours</h3>
          <p id="kpi-leads">-</p>
        </article>
        <article>
          <h3>Taux de conversion</h3>
          <p id="kpi-conversion">-</p>
        </article>
      </div>
    </section>
    <section>
      <h2>Pages les plus consultées</h2>
      <table id="top-pages" aria-live="polite">
        <thead>
          <tr>
            <th>Page</th>
            <th>Sessions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
    <section>
      <h2>Flux d'événements</h2>
      <ul id="events"></ul>
    </section>
  </main>
</body>
</html>
